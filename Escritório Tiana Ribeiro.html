<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Escritório Tiana Ribeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: barra lateral fixa em azul-marinho (identidade do escritório) + área de trabalho em painéis; no celular a barra vira faixa rolável no topo */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --panel2:#F5F7FA; --line:#D7DDE6; --ink:#0F1C2C; --muted:#5A697C;
  --accent:#1F3864; --accent-ink:#FFFFFF; --accent-soft:rgba(31,56,100,.09);
  --side:#042C53; --side-ink:#DCE5F0; --side-muted:#8FA6C2; --side-hi:rgba(255,255,255,.08);
  --gold:#8E6B36; --gold-line:#B08D57; --gold-soft:rgba(176,141,87,.14);
  --ok:#2C7656; --ok-soft:rgba(44,118,86,.12); --warn:#A86A12; --warn-soft:rgba(168,106,18,.13); --bad:#B23F2C; --bad-soft:rgba(178,63,44,.11);
  --f1:#C5D3E3; --f2:#97B0CE; --f3:#D8C29C; --f4:#BDB5D6; --f5:#5E86B3; --f6:#1F3864; --f7:#B9C1CB; --f8:#B08D57;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09131F; --panel:#0F1D2E; --panel2:#142538; --line:#21364D; --ink:#E5EBF2; --muted:#8C9EB3;
    --accent:#8DB0E2; --accent-ink:#09131F; --accent-soft:rgba(141,176,226,.12);
    --side:#061424; --side-ink:#DCE5F0; --side-muted:#7F95B0; --side-hi:rgba(255,255,255,.07);
    --gold:#D4B07A; --gold-line:#B08D57; --gold-soft:rgba(212,176,122,.14);
    --ok:#62B58E; --ok-soft:rgba(98,181,142,.14); --warn:#E0A54A; --warn-soft:rgba(224,165,74,.14); --bad:#EC7A63; --bad-soft:rgba(236,122,99,.14);
    --f1:#2B3E55; --f2:#3C5A7E; --f3:#6E5A38; --f4:#4A4568; --f5:#4F79A8; --f6:#8DB0E2; --f7:#3E4A58; --f8:#B08D57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09131F; --panel:#0F1D2E; --panel2:#142538; --line:#21364D; --ink:#E5EBF2; --muted:#8C9EB3;
  --accent:#8DB0E2; --accent-ink:#09131F; --accent-soft:rgba(141,176,226,.12);
  --side:#061424; --side-ink:#DCE5F0; --side-muted:#7F95B0; --side-hi:rgba(255,255,255,.07);
  --gold:#D4B07A; --gold-line:#B08D57; --gold-soft:rgba(212,176,122,.14);
  --ok:#62B58E; --ok-soft:rgba(98,181,142,.14); --warn:#E0A54A; --warn-soft:rgba(224,165,74,.14); --bad:#EC7A63; --bad-soft:rgba(236,122,99,.14);
  --f1:#2B3E55; --f2:#3C5A7E; --f3:#6E5A38; --f4:#4A4568; --f5:#4F79A8; --f6:#8DB0E2; --f7:#3E4A58; --f8:#B08D57;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* Barra lateral */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.brand{padding:0 8px 18px;border-bottom:1px solid rgba(176,141,87,.45);margin-bottom:14px}
.brand b{display:block;font:600 19px/1.15 var(--display);color:#fff}
.brand span{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-line);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;color:var(--side-ink);font-weight:500;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:var(--side-muted);fill:none;stroke-width:1.7}
.nav button:hover{background:var(--side-hi)}
.nav button:focus-visible{outline:2px solid var(--gold-line);outline-offset:0}
.nav button[aria-current="page"]{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--gold-line);color:#fff}
.nav button[aria-current="page"] svg{stroke:var(--gold-line)}
.nav .badge{margin-left:auto;font:500 11.5px/1 var(--mono);background:rgba(176,141,87,.22);color:#F1DDB8;padding:3px 6px;border-radius:999px}
.nav .badge.bad{background:rgba(236,122,99,.25);color:#FFD4CB}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--side-hi);font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px}
.side-foot button{all:unset;cursor:pointer;color:var(--side-ink);font-weight:500}
.side-foot button:hover{text-decoration:underline}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--side-muted)}
.dot.on{background:#62B58E}

/* Área principal */
main{min-width:0;padding-block:26px 70px;padding-inline:clamp(16px,3vw,36px)}
.view-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.view-h h1{font-size:clamp(24px,2.6vw,30px);line-height:1.15}
.view-h p{margin:4px 0 0;color:var(--muted)}
.view-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 10px}
.ph h2{font-size:18px}
.ph span,.ph button.link{font-size:13px;color:var(--muted)}
.link{all:unset;cursor:pointer;color:var(--accent)!important;font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{border-color:var(--gold-line);color:var(--gold)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=url],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;min-width:0}
textarea{resize:vertical;min-height:70px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools>input[type=search]{flex:1 1 260px;width:auto}
.tools>select{width:auto;flex:0 1 200px}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-left:auto}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.kpi{all:unset;cursor:pointer;padding:15px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--panel2)}
.kpi:focus-visible{outline:2px solid var(--gold-line);outline-offset:-2px}
.kpi small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font:500 30px/1.1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi b.money{font-size:23px;line-height:1.35}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi span.bad{color:var(--bad);font-weight:600}
.kpi span.warn{color:var(--warn);font-weight:600}

/* Listas e linhas */
.rows{display:flex;flex-direction:column}
.r{display:grid;gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:start;cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.r:hover{background:var(--panel2)}
.r:focus-visible{outline:2px solid var(--gold-line);outline-offset:-2px}
.r .t1{font-weight:600;overflow-wrap:anywhere}
.r .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.when{display:flex;flex-direction:column;align-items:flex-start;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.3}
.when b{font-size:17px;font-weight:500;color:var(--ink)}
.when span{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 17px/1.3 var(--display);margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}

/* Processos */
.pipe{padding:4px 16px 14px}
.bar{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}
.seg{border:0;padding:0;min-width:6px;cursor:pointer}
.seg[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.leg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
.leg i{width:10px;height:10px;border-radius:3px}
.leg b{font-family:var(--mono);font-weight:500}
.leg[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tbl-proc .r{grid-template-columns:minmax(200px,2fr) minmax(170px,1.5fr) 132px minmax(190px,2fr) 96px}
.thead{display:grid;gap:12px;padding:9px 16px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl-proc .thead{grid-template-columns:minmax(200px,2fr) minmax(170px,1.5fr) 132px minmax(190px,2fr) 96px}
.cli{font:600 15.5px/1.3 var(--display)}
.prazo{font-family:var(--mono);font-size:13px}
.prazo.venc{color:var(--bad);font-weight:600}
.prazo.logo{color:var(--warn);font-weight:600}
.prazo.none{color:var(--muted)}
.ml{display:none;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Audiências */
.day{margin-top:18px}
.day:first-child{margin-top:0}
.day-h{display:flex;gap:10px;align-items:baseline;padding:0 2px 6px;border-bottom:1px solid var(--gold-line)}
.day-h h3{font-size:17px;color:var(--gold)}
.day-h span{font-size:13px;color:var(--muted)}
.aud .r{grid-template-columns:66px minmax(0,1fr) auto;border-top:0;border-bottom:1px solid var(--line);padding-inline:6px}
.aud .r.past .when b{color:var(--muted)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* Pendências */
.pend .r{grid-template-columns:22px minmax(0,1fr) auto}
.ckbox{width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.r.done .t1{text-decoration:line-through;color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Financeiro */
.fin .r{grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr) 128px 112px}
.fin .thead{grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr) 128px 112px}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.val.in{color:var(--ok)} .val.out{color:var(--bad)}
.chart{padding:4px 16px 14px}
.chart svg{width:100%;height:auto;display:block}
.chart .lg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.chart .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.split div{padding:12px 16px;border-right:1px solid var(--line)}
.split div:last-child{border-right:0}
.split small{display:block;font-size:12px;color:var(--muted)}
.split b{font:500 17px/1.3 var(--mono)}

/* Modelos */
.mod-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mod-list{padding:6px}
.mod-list h4{margin:12px 10px 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mod-list button{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:6px;font-size:14px;width:calc(100% - 20px)}
.mod-list button:hover{background:var(--panel2)}
.mod-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mod-work{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.fields{padding:14px 16px;display:grid;gap:10px}
.fields label{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:3px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,4vw,46px);font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;font-size:14px;line-height:1.65;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.paper .hl{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px;font-weight:600}
.paper .tit{display:block;text-align:center;font-weight:700;color:var(--accent);letter-spacing:.02em}
.paper .sec{font-weight:700;color:var(--accent)}
.paper-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.note{font-size:12.5px;color:var(--muted)}

/* Triagem */
.tri-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.tri-type{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.tri-type:hover{border-color:var(--accent)}
.tri-type:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
.tri-type[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tri-type b{font-weight:600}
.tri-type span{font-size:12.5px;color:var(--muted)}
.qs{padding:6px 16px 16px;display:flex;flex-direction:column}
.q{padding:13px 0;border-top:1px solid var(--line);display:grid;gap:7px}
.q:first-child{border-top:0}
.q .qt{font-weight:600}
.q .qh{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:13.5px;background:var(--panel)}
.opt:hover{background:var(--panel2)}
.opt:focus-visible{outline:2px solid var(--gold-line);outline-offset:1px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.verdict{padding:16px}
.meter{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px}
.vb{font:600 24px/1.2 var(--display)}
.vlist h4{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vlist ul{margin:0;padding-left:18px}
.vlist li{margin:3px 0}
.tri-side{position:sticky;top:16px;align-self:start}
@media (max-width:1100px){.tri-side{position:static}}
.parecer{white-space:pre-wrap;font-size:13.5px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}

/* Modal */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(4,14,26,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh h2{font-size:20px}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--panel2)}
.db{padding:16px 20px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 3;min-width:0}
.f.s2{grid-column:span 2}.f.s6{grid-column:span 6}
.f>label{font-size:12.5px;color:var(--muted);font-weight:500}
.f.chkf{flex-direction:row;align-items:center;gap:8px}
.df{display:flex;gap:8px;padding:13px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--bad);font-weight:500}
.msgbox{grid-column:span 6;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;max-height:44vh;overflow:auto}
.checks{grid-column:span 6;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.checks .hd{grid-column:span 2;font-size:12.5px;color:var(--muted);font-weight:500;padding:2px 0 4px}

.notice{background:var(--warn-soft);border:1px solid transparent;color:var(--ink);border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:60}
.toast.on{opacity:1}

@media (max-width:1100px){
  .grid2{grid-template-columns:1fr}
  .mod-work{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:20;overflow-x:auto;overflow-y:hidden}
  .brand{border:0;padding:0 6px 0 2px;margin:0;flex:none}
  .brand span{display:none}
  .brand b{font-size:16px}
  .nav{flex-direction:row;gap:2px;flex:none}
  .nav button{padding:7px 10px;font-size:13px}
  .nav button svg{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--gold-line)}
  .side-foot{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .mod-layout{grid-template-columns:1fr}
  .thead{display:none}
  .tbl-proc .r,.fin .r{grid-template-columns:1fr 1fr;gap:6px 12px}
  .tbl-proc .r>.c-caso,.tbl-proc .r>.c-prox,.fin .r>.c-desc{grid-column:1/-1}
  .ml{display:block}
  .split{grid-template-columns:1fr}
  .split div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .f,.f.s2{grid-column:span 6}
  .aud .r{grid-template-columns:56px minmax(0,1fr)}
  .aud .meta{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center}
  .pend .r{grid-template-columns:22px minmax(0,1fr)}
  .pend .r .meta{grid-column:2;align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .checks{grid-template-columns:1fr}.checks .hd{grid-column:span 1}
  .kpi b{font-size:25px}.kpi b.money{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" aria-label="Menu">
    <div class="brand"><b>Tiana Ribeiro</b><span>Advocacia e Consultoria</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Conectando…</span></div>
      <button type="button" id="btnConfig">Dados do escritório</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================== CONSTANTES ============================== */
const FASES=[
 {k:"Análise",v:"--f1"},{k:"Pré-ajuizamento",v:"--f2"},{k:"Extrajudicial",v:"--f3"},{k:"Consultivo",v:"--f4"},
 {k:"1º grau",v:"--f5"},{k:"Recurso",v:"--f6"},{k:"Execução de sentença",v:"--f8"},{k:"Finalizado",v:"--f7"}];
const ORDFASE=Object.fromEntries(FASES.map((f,i)=>[f.k,i]));
const AREAS=["Consumidor","Previdenciário","Trabalhista","Família","Imobiliário","Administrativo","Tributário","Cível","Justiça Federal"];
const CHECK_AUD=[["cliente","Cliente avisado e confirmou"],["docs","Documento com foto do cliente"],["provas","Provas e testemunhas organizadas"],["defesa","Contestação lida (se houver)"],["acordo","Proposta mínima de acordo definida"],["acesso","Link da sala testado"]];
const CAT_REC=["Honorários iniciais","Parcela de honorários","Honorários de êxito","Honorários de sucumbência","Consulta","Outros"];
const CAT_DESP=["Custas e preparo","Diligências e deslocamento","Cartório e certidões","Repasse a parceiro","Anúncios e marketing","Sistemas e assinaturas","Aluguel e estrutura","Outras despesas"];
const TIPO_TAREFA=["Prazo processual","Documento do cliente","Protocolo","Contato com cliente","Financeiro","Outro"];

const ICONS={
 inicio:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
 processos:'<svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h6"/></svg>',
 audiencias:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 pendencias:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg>',
 financeiro:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 9.5v6M18 9.5v6"/></svg>',
 modelos:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>',
 triagem:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11l2 2 3.5-3.5"/></svg>'
};
const VIEWS=[["inicio","Início"],["processos","Processos"],["audiencias","Audiências"],["pendencias","Pendências"],["financeiro","Financeiro"],["modelos","Modelos"],["triagem","Triagem"]];

/* ============================== ESTADO ============================== */
const S={casos:[],audiencias:[],tarefas:[],lancamentos:[],modelos:[],config:[],ok:{}};
let db=null,sample=null,dl=null,podeEscrever=true;
const COLS=["casos","audiencias","tarefas","lancamentos","modelos","config"];
let view="inicio";
const F={proc:{fase:null,q:"",area:"",parc:"",conf:false,fin:false},aud:{st:"proximas",q:""},pend:{st:"abertas",q:"",src:""},fin:{mes:mesAtual(),q:"",tipo:"",st:""},mod:{id:"proc-adjudicia",casoId:"",vals:{}},tri:{tipo:null,resp:{},parecer:"",cliente:"",contra:""}};

/* ============================== UTILITÁRIOS ============================== */
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hoje(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hojeISO(){return iso(new Date())}
function mesAtual(){return hojeISO().slice(0,7)}
function dt(s){return s?new Date(s+"T00:00:00"):null}
function fmtD(s){if(!s)return "";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y}
function fmtDc(s){if(!s)return "";const[y,m,d]=s.split("-");return d+"/"+m}
function dias(s){if(!s)return null;return Math.round((dt(s)-hoje())/864e5)}
const SEM=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESC=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function extenso(s){const d=dt(s);return d.getDate()+" de "+MES[d.getMonth()]+" de "+d.getFullYear()}
function brl(n){return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function relDia(s){const n=dias(s);if(n===0)return "hoje";if(n===1)return "amanhã";if(n===-1)return "ontem";if(n<0)return "há "+(-n)+" dias";return "em "+n+" dias"}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2800)}
function corFase(k){const f=FASES.find(x=>x.k===k);return f?"var("+f.v+")":"var(--f7)"}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function ativo(c){return c.fase!=="Finalizado"}
function classePrazo(s){if(!s)return "none";const n=dias(s);if(n<0)return "venc";if(n<=7)return "logo";return ""}
async function copiar(txt,btn){
  try{await navigator.clipboard.writeText(txt);toast("Copiado")}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();toast(ok?"Copiado":"Selecione o texto e copie manualmente")}
}
function falha(e){console.error(e);const c=e&&e.code;toast(c==="not_granted"||c==="permission_denied"?"Você não tem permissão para alterar estes dados.":"Não foi possível salvar. Verifique a conexão e tente de novo.")}
function moeda(v){let s=String(v||"").replace(/R\$|\s/g,"");if(!s)return "";if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const n=Number(s);return isFinite(n)?Math.round(n*100)/100:""}
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
function cfg(){return (S.config.find(x=>x.id==="escritorio"))||{}}

/* ============================== BANCO ============================== */
async function salvar(col,id,dados){
  if(!db){toast("Abra o sistema pelo claude.ai para salvar.");return false}
  try{
    dados.atualizado=hojeISO();
    if(id) await db.collection(col).doc(id).update(dados);
    else await db.collection(col).add(dados);
    return true;
  }catch(e){falha(e);return false}
}
async function excluir(col,id){if(!db)return false;try{await db.collection(col).doc(id).delete();return true}catch(e){falha(e);return false}}

/* ============================== NAVEGAÇÃO ============================== */
function contadores(){
  const pv=pendencias().filter(p=>!p.feito&&p.prazo&&dias(p.prazo)<=0).length;
  const au=S.audiencias.filter(a=>a.status!=="cancelada"&&a.status!=="realizada"&&a.data&&dias(a.data)>=0&&dias(a.data)<=7).length;
  return {pendencias:pv?{n:pv,bad:true}:null,audiencias:au?{n:au}:null,processos:{n:S.casos.filter(ativo).length}};
}
function renderNav(){
  const c=contadores();
  $("nav").innerHTML=VIEWS.map(([k,t])=>{const b=c[k];return `<button type="button" data-v="${k}" ${view===k?'aria-current="page"':""}>${ICONS[k]}<span>${t}</span>${b?`<span class="badge ${b.bad?"bad":""}">${b.n}</span>`:""}</button>`}).join("");
}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)ir(b.dataset.v)});
function ir(v){view=v;lsSet("esc.view",v);try{history.replaceState(null,"","#"+v)}catch(_){}render();window.scrollTo({top:0})}
function render(){renderNav();const m=$("main");const fn={inicio:vInicio,processos:vProcessos,audiencias:vAudiencias,pendencias:vPendencias,financeiro:vFinanceiro,modelos:vModelos,triagem:vTriagem}[view]||vInicio;m.innerHTML=fn();(posRender[view]||(()=>{}))()}
const posRender={};

/* ============================== PENDÊNCIAS (unificadas) ============================== */
function pendencias(){
  const out=[];
  S.tarefas.forEach(t=>out.push({src:"Tarefa",id:t.id,titulo:t.titulo,sub:[t.caso,t.tipo,t.responsavel].filter(Boolean).join(" · "),prazo:t.prazo||"",feito:!!t.feito,prioridade:t.prioridade||"Normal",abrir:()=>formTarefa(t)}));
  S.casos.filter(ativo).forEach(c=>{
    if(c.prazo&&c.proximo&&!/^nenhum/i.test(c.proximo)) out.push({src:"Processo",id:"c:"+c.id,titulo:c.proximo,sub:[c.cliente,c.contra].filter(Boolean).join(" x "),prazo:c.prazo,feito:false,abrir:()=>formCaso(c)});
    if(c.conferir||c.incompleto) out.push({src:"Cadastro",id:"k:"+c.id,titulo:c.conferir?"Conferir dados do processo":"Completar cadastro",sub:[c.cliente,c.contra].filter(Boolean).join(" x "),prazo:"",feito:false,abrir:()=>formCaso(c)});
  });
  S.audiencias.filter(a=>a.status==="ativa"&&a.data&&dias(a.data)>=0&&dias(a.data)<=10).forEach(a=>{
    const ck=a.checklist||{};const falt=CHECK_AUD.filter(([k])=>!ck[k]).length;
    if(falt) out.push({src:"Audiência",id:"a:"+a.id,titulo:`Preparar audiência — faltam ${falt} de ${CHECK_AUD.length} itens`,sub:[a.parte,a.contraparte].filter(Boolean).join(" x ")+" · "+fmtD(a.data)+" "+(a.hora||""),prazo:a.data,feito:false,abrir:()=>formAud(a)});
    if(!a.conferida) out.push({src:"Audiência",id:"ac:"+a.id,titulo:"Conferir audiência no sistema do tribunal",sub:[a.parte,a.contraparte].filter(Boolean).join(" x ")+" · "+fmtD(a.data),prazo:a.data,feito:false,abrir:()=>formAud(a)});
  });
  S.lancamentos.filter(l=>l.tipo==="receita"&&!l.pagoEm&&l.vencimento&&dias(l.vencimento)<0).forEach(l=>out.push({src:"Financeiro",id:"f:"+l.id,titulo:"Cobrar: "+(l.descricao||"recebimento em atraso"),sub:[l.cliente,brl(l.valor)].filter(Boolean).join(" · "),prazo:l.vencimento,feito:false,abrir:()=>formLanc(l)}));
  return out;
}
function ordPend(a,b){if(a.feito!==b.feito)return a.feito?1:-1;const pa=a.prazo||"9999",pb=b.prazo||"9999";return pa<pb?-1:pa>pb?1:0}
function linhaPend(p){
  const n=p.prazo?dias(p.prazo):null;
  const cls=p.feito?"ok":n===null?"":n<0?"bad":n<=2?"warn":"";
  const tx=p.feito?"Feito":n===null?"Sem prazo":n<0?"Vencida "+relDia(p.prazo):relDia(p.prazo);
  return `<div class="r ${p.feito?"done":""}" role="button" tabindex="0" data-pid="${esc(p.id)}">
    ${p.src==="Tarefa"?`<input type="checkbox" class="ckbox" data-feito="${esc(p.id)}" ${p.feito?"checked":""} aria-label="Marcar como feita">`:`<span></span>`}
    <div style="min-width:0"><div class="src">${esc(p.src)}${p.prioridade==="Alta"&&!p.feito?' · <span style="color:var(--bad)">Prioridade alta</span>':""}</div><div class="t1">${esc(p.titulo)}</div><div class="t2">${esc(p.sub)}</div></div>
    <div class="meta"><span class="pill ${cls}">${esc(tx)}</span>${p.prazo?`<span class="prazo">${fmtD(p.prazo)}</span>`:""}</div></div>`;
}
function bindPend(lista){
  const mapa=Object.fromEntries(lista.map(p=>[p.id,p]));
  document.querySelectorAll("[data-pid]").forEach(el=>{
    const go=e=>{if(e.target.closest("[data-feito]"))return;mapa[el.dataset.pid]&&mapa[el.dataset.pid].abrir()};
    el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter")go(e)});
  });
  document.querySelectorAll("[data-feito]").forEach(cb=>cb.addEventListener("change",async e=>{
    e.stopPropagation();const t=S.tarefas.find(x=>x.id===cb.dataset.feito);if(!t)return;
    if(await salvar("tarefas",t.id,{feito:cb.checked,feitoEm:cb.checked?hojeISO():""})) toast(cb.checked?"Pendência concluída":"Pendência reaberta");
  }));
}

/* ============================== INÍCIO ============================== */
function vInicio(){
  const at=S.casos.filter(ativo);
  const prox=S.audiencias.filter(a=>a.status==="ativa"&&a.data&&dias(a.data)>=0).sort((a,b)=>(a.data+a.hora)<(b.data+b.hora)?-1:1);
  const prox30=prox.filter(a=>dias(a.data)<=30);
  const pend=pendencias().filter(p=>!p.feito);
  const venc=pend.filter(p=>p.prazo&&dias(p.prazo)<0).length, hojeN=pend.filter(p=>p.prazo&&dias(p.prazo)===0).length;
  const m=mesAtual();
  const recMes=S.lancamentos.filter(l=>l.tipo==="receita"&&l.pagoEm&&l.pagoEm.slice(0,7)===m).reduce((s,l)=>s+(+l.valor||0),0);
  const aRec=S.lancamentos.filter(l=>l.tipo==="receita"&&!l.pagoEm).reduce((s,l)=>s+(+l.valor||0),0);
  const atras=S.lancamentos.filter(l=>l.tipo==="receita"&&!l.pagoEm&&l.vencimento&&dias(l.vencimento)<0).length;
  const d=new Date();
  const urg=pend.filter(p=>p.prazo&&dias(p.prazo)<=7).sort(ordPend).slice(0,7);
  const conf=at.filter(c=>c.conferir).length;
  posRender.inicio=()=>{bindPend(urg);bindAudRows(prox.slice(0,6));bindPipe(at,true);
    document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.pfin){F.proc.fin=false}ir(b.dataset.go)}))};
  return `
  <div class="view-h"><div><h1>${saud()}, Dra. Tiana</h1><p>${SEM[d.getDay()].replace(/^./,c=>c.toUpperCase())}, ${extenso(hojeISO())}</p></div>
  <div class="acts"><button class="btn" type="button" onclick="ir('triagem')">Triar caso novo</button><button class="btn" type="button" onclick="formTarefa()">+ Pendência</button><button class="btn primary" type="button" onclick="formCaso()">+ Processo</button></div></div>
  ${aviso()}
  <section class="kpis">
    <button class="kpi" type="button" data-go="processos"><small>Processos ativos</small><b>${at.length}</b><span>${conf?`<span class="warn">${conf} a conferir</span>`:S.casos.length-at.length+" finalizados"}</span></button>
    <button class="kpi" type="button" data-go="audiencias"><small>Audiências · 30 dias</small><b>${prox30.length}</b><span>${prox[0]?"Próxima "+relDia(prox[0].data)+" às "+(prox[0].hora||"--"):"Nenhuma marcada"}</span></button>
    <button class="kpi" type="button" data-go="pendencias"><small>Pendências abertas</small><b>${pend.length}</b><span class="${venc?"bad":hojeN?"warn":""}">${venc?venc+" vencidas":hojeN?hojeN+" para hoje":"Nada vencido"}</span></button>
    <button class="kpi" type="button" data-go="financeiro"><small>Recebido no mês</small><b class="money">${brl(recMes)}</b><span class="${atras?"bad":""}">${atras?atras+" em atraso · ":""}${brl(aRec)} a receber</span></button>
  </section>
  <div class="grid2">
    <div class="stack">
      <section class="panel"><div class="ph"><h2>Pendências da semana</h2><button class="link" type="button" data-go="pendencias">Ver todas</button></div>
        <div class="rows pend">${urg.length?urg.map(linhaPend).join(""):`<div class="empty"><b>Semana limpa</b>Nada vence nos próximos 7 dias.</div>`}</div></section>
      <section class="panel"><div class="ph"><h2>Processos por fase</h2><button class="link" type="button" data-go="processos">Abrir processos</button></div>${pipeHTML(at,true)}</section>
    </div>
    <div class="stack">
      <section class="panel"><div class="ph"><h2>Próximas audiências</h2><button class="link" type="button" data-go="audiencias">Agenda completa</button></div>
        <div class="rows aud" style="padding:0 10px 6px">${prox.length?prox.slice(0,6).map(a=>linhaAud(a,true)).join(""):`<div class="empty"><b>Agenda livre</b>Nenhuma audiência futura cadastrada.</div>`}</div></section>
      ${miniFin()}
    </div>
  </div>`;
}
function saud(){const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function aviso(){
  if(!S.ok.conectado&&S.ok.tentou) return `<div class="notice">${esc(S.ok.msg||"Abra o sistema pelo claude.ai, com sua conta conectada, para ver e editar os dados.")}</div>`;
  if(!S.ok.conectado) return `<div class="notice" style="background:var(--panel2)">Carregando os dados do escritório…</div>`;
  return "";
}
function miniFin(){
  const m=mesAtual();const rec=S.lancamentos.filter(l=>l.tipo==="receita"&&(l.pagoEm||"").slice(0,7)===m).reduce((s,l)=>s+(+l.valor||0),0);
  const desp=S.lancamentos.filter(l=>l.tipo==="despesa"&&(l.pagoEm||l.vencimento||"").slice(0,7)===m).reduce((s,l)=>s+(+l.valor||0),0);
  const prev=S.lancamentos.filter(l=>l.tipo==="receita"&&!l.pagoEm&&(l.vencimento||"").slice(0,7)===m).reduce((s,l)=>s+(+l.valor||0),0);
  return `<section class="panel"><div class="ph"><h2>Financeiro de ${MES[+m.slice(5)-1]}</h2><button class="link" type="button" data-go="financeiro">Abrir financeiro</button></div>
  ${S.lancamentos.length?`<div class="split"><div><small>Recebido</small><b style="color:var(--ok)">${brl(rec)}</b></div><div><small>A receber no mês</small><b>${brl(prev)}</b></div><div><small>Despesas</small><b style="color:var(--bad)">${brl(desp)}</b></div></div>`
  :`<div class="empty" style="border-top:1px solid var(--line)"><b>Sem lançamentos ainda</b>Cadastre honorários e despesas para acompanhar o caixa.<div style="margin-top:10px"><button class="btn sm" type="button" onclick="formLanc()">+ Lançamento</button></div></div>`}</section>`;
}

/* ============================== PROCESSOS ============================== */
function pipeHTML(lista,compact){
  const tot=lista.length||1;const cont=Object.fromEntries(FASES.map(f=>[f.k,0]));lista.forEach(c=>{if(c.fase in cont)cont[c.fase]++});
  const fs=FASES.filter(f=>compact?f.k!=="Finalizado":true);
  return `<div class="pipe"><div class="bar">${fs.filter(f=>cont[f.k]).map(f=>`<button class="seg" type="button" data-fase="${f.k}" aria-pressed="${F.proc.fase===f.k}" title="${f.k}: ${cont[f.k]}" style="flex:${cont[f.k]};background:var(${f.v})"></button>`).join("")||'<span style="flex:1"></span>'}</div>
  <div class="legend">${fs.map(f=>`<button class="leg" type="button" data-fase="${f.k}" aria-pressed="${F.proc.fase===f.k}"><i style="background:var(${f.v})"></i>${f.k} <b>${cont[f.k]}</b></button>`).join("")}</div></div>`;
}
function bindPipe(lista,navega){

function linhaAud(a,compact){
  const n=dias(a.data);const past=n<0;const ck=a.checklist||{};const feitos=CHECK_AUD.filter(([k])=>ck[k]).length;
  const st=a.status==="realizada"?'<span class="pill ok">Realizada</span>':a.status==="cancelada"?'<span class="pill">Cancelada</span>':a.status==="redesignada"?'<span class="pill">Redesignada</span>':past?'<span class="pill bad">Dar baixa</span>':n<=2?`<span class="pill warn">${relDia(a.data)}</span>`:`<span class="pill acc">${relDia(a.data)}</span>`;
  return `<div class="r ${past?"past":""}" role="button" tabindex="0" data-aid="${esc(a.id)}">
    <div class="when"><b>${esc(a.hora||"--:--")}</b>${compact?`<span>${fmtDc(a.data)}</span>`:""}</div>
    <div style="min-width:0"><div class="t1">${esc(a.parte||"(cliente)")}${a.contraparte?` <span style="font-weight:400;color:var(--muted)">x ${esc(a.contraparte)}</span>`:""}</div>
      <div class="t2">${esc([a.tipo,a.juizo].filter(Boolean).join(" · "))}</div>${compact?"":`<div class="t2 mono" style="font-size:12px">${esc(a.processo||"")}</div>`}</div>
    <div class="meta">${st}${a.status==="ativa"&&!past?`<span class="pill ${feitos===CHECK_AUD.length?"ok":""}">Preparo ${feitos}/${CHECK_AUD.length}</span>`:""}${!a.conferida&&a.status==="ativa"?'<span class="pill warn">Conferir</span>':""}</div></div>`;
}
function bindAudRows(){document.querySelectorAll("[data-aid]").forEach(el=>{const go=()=>{const a=S.audiencias.find(x=>x.id===el.dataset.aid);a&&formAud(a)};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter")go()})})}
function vAudiencias(){
  const f=F.aud,q=norm(f.q);
  let l=S.audiencias.filter(a=>!q||norm([a.parte,a.contraparte,a.processo,a.juizo].join(" ")).includes(q));
  if(f.st==="proximas")l=l.filter(a=>a.status==="ativa"&&dias(a.data)>=0);
  else if(f.st==="baixa")l=l.filter(a=>a.status==="ativa"&&dias(a.data)<0);
  else if(f.st==="realizadas")l=l.filter(a=>a.status==="realizada");
  l.sort((a,b)=>{const x=(a.data||"")+(a.hora||""),y=(b.data||"")+(b.hora||"");return f.st==="realizadas"?(x<y?1:-1):(x<y?-1:1)});
  const grupos={};l.forEach(a=>(grupos[a.data||"sem data"]=grupos[a.data||"sem data"]||[]).push(a));
  const nBaixa=S.audiencias.filter(a=>a.status==="ativa"&&dias(a.data)<0).length;
  posRender.audiencias=()=>{bindAudRows();const s=$("aq");s.addEventListener("input",()=>{f.q=s.value;render();const n=$("aq");n.focus();n.setSelectionRange(n.value.length,n.value.length)});$("ast").onchange=e=>{f.st=e.target.value;render()}};
  return `<div class="view-h"><div><h1>Audiências</h1><p>${S.audiencias.filter(a=>a.status==="ativa"&&dias(a.data)>=0).length} marcadas daqui em diante${nBaixa?` · <span style="color:var(--bad);font-weight:600">${nBaixa} aguardando baixa</span>`:""}</p></div>
  <div class="acts"><button class="btn primary" type="button" onclick="formAud()">+ Audiência</button></div></div>
  ${aviso()}
  <div class="tools"><input type="search" id="aq" value="${esc(f.q)}" placeholder="Buscar cliente, parte contrária, processo ou juízo" aria-label="Buscar audiências">
  <select id="ast" aria-label="Situação"><option value="proximas" ${f.st==="proximas"?"selected":""}>Próximas</option><option value="baixa" ${f.st==="baixa"?"selected":""}>Passadas sem baixa</option><option value="realizadas" ${f.st==="realizadas"?"selected":""}>Realizadas</option><option value="todas" ${f.st==="todas"?"selected":""}>Todas</option></select></div>
  <section class="panel aud" style="padding:14px 16px">${Object.keys(grupos).length?Object.entries(grupos).map(([d,as])=>`<div class="day"><div class="day-h"><h3>${d==="sem data"?"Sem data":(SEM[dt(d).getDay()].replace(/^./,c=>c.toUpperCase())+", "+fmtD(d))}</h3><span>${d==="sem data"?"":relDia(d)} · ${as.length} audiência${as.length>1?"s":""}</span></div><div class="rows">${as.map(a=>linhaAud(a,false)).join("")}</div></div>`).join("")
  :`<div class="empty"><b>Nenhuma audiência nesta visão</b>Cadastre com “+ Audiência” ou a partir de um processo.</div>`}</section>`;
}

/* ============================== PENDÊNCIAS ============================== */
function vPendencias(){
  const f=F.pend,q=norm(f.q);
  let l=pendencias().filter(p=>(!f.src||p.src===f.src)&&(!q||norm(p.titulo+" "+p.sub).includes(q)));
  if(f.st==="abertas")l=l.filter(p=>!p.feito);else if(f.st==="feitas")l=l.filter(p=>p.feito);
  l.sort(ordPend);
  const grp=[["Vencidas",p=>!p.feito&&p.prazo&&dias(p.prazo)<0],["Hoje",p=>!p.feito&&p.prazo&&dias(p.prazo)===0],["Próximos 7 dias",p=>!p.feito&&p.prazo&&dias(p.prazo)>0&&dias(p.prazo)<=7],["Mais adiante",p=>!p.feito&&p.prazo&&dias(p.prazo)>7],["Sem prazo",p=>!p.feito&&!p.prazo],["Concluídas",p=>p.feito]];
  posRender.pendencias=()=>{bindPend(l);const s=$("tq");s.addEventListener("input",()=>{f.q=s.value;render();const n=$("tq");n.focus();n.setSelectionRange(n.value.length,n.value.length)});$("tst").onchange=e=>{f.st=e.target.value;render()};$("tsrc").onchange=e=>{f.src=e.target.value;render()}};
  return `<div class="view-h"><div><h1>Pendências</h1><p>Tarefas avulsas e o que vem dos processos, audiências e financeiro, num lugar só.</p></div>
  <div class="acts"><button class="btn primary" type="button" onclick="formTarefa()">+ Pendência</button></div></div>
  ${aviso()}
  <div class="tools"><input type="search" id="tq" value="${esc(f.q)}" placeholder="Buscar pendência ou cliente" aria-label="Buscar pendências">
  <select id="tsrc" aria-label="Origem"><option value="">Todas as origens</option>${["Tarefa","Processo","Audiência","Cadastro","Financeiro"].map(s=>`<option ${f.src===s?"selected":""}>${s}</option>`).join("")}</select>
  <select id="tst" aria-label="Situação"><option value="abertas" ${f.st==="abertas"?"selected":""}>Abertas</option><option value="feitas" ${f.st==="feitas"?"selected":""}>Concluídas</option><option value="todas" ${f.st==="todas"?"selected":""}>Todas</option></select></div>
  <div class="stack">${grp.map(([t,fn])=>{const it=l.filter(fn);return it.length?`<section class="panel"><div class="ph"><h2 style="${t==="Vencidas"?"color:var(--bad)":""}">${t}</h2><span>${it.length}</span></div><div class="rows pend">${it.map(linhaPend).join("")}</div></section>`:""}).join("")||`<section class="panel"><div class="empty"><b>Nenhuma pendência aqui</b>Crie uma com “+ Pendência”. Prazos dos processos e preparo de audiências aparecem sozinhos.</div></section>`}</div>`;
}

/* ============================== FINANCEIRO ============================== */
function vFinanceiro(){
  const f=F.fin,m=f.mes,q=norm(f.q);
  const L=S.lancamentos;
  const doMes=l=>((l.pagoEm||l.vencimento||"").slice(0,7)===m);
  const rec=L.filter(l=>l.tipo==="receita"&&l.pagoEm&&l.pagoEm.slice(0,7)===m).reduce((s,l)=>s+(+l.valor||0),0);
  const desp=L.filter(l=>l.tipo==="despesa"&&doMes(l)).reduce((s,l)=>s+(+l.valor||0),0);
  const aberto=L.filter(l=>l.tipo==="receita"&&!l.pagoEm);
  const aRec=aberto.reduce((s,l)=>s+(+l.valor||0),0);
  const vencidos=aberto.filter(l=>l.vencimento&&dias(l.vencimento)<0);
  const vVenc=vencidos.reduce((s,l)=>s+(+l.valor||0),0);
  let lista=L.filter(l=>doMes(l)||(f.st==="aberto"&&l.tipo==="receita"&&!l.pagoEm)||(f.st==="atraso"&&l.tipo==="receita"&&!l.pagoEm&&dias(l.vencimento)<0));
  if(f.st==="aberto")lista=aberto;if(f.st==="atraso")lista=vencidos;
  lista=lista.filter(l=>(!f.tipo||l.tipo===f.tipo)&&(!q||norm([l.descricao,l.cliente,l.categoria,l.parceria].join(" ")).includes(q))).sort((a,b)=>((a.pagoEm||a.vencimento)>(b.pagoEm||b.vencimento)?1:-1));
  // gráfico 6 meses
  const meses=[];const base=new Date(+m.slice(0,4),+m.slice(5)-1,1);for(let i=5;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);meses.push(iso(d).slice(0,7))}
  const serie=meses.map(mm=>({mm,r:L.filter(l=>l.tipo==="receita"&&(l.pagoEm||"").slice(0,7)===mm).reduce((s,l)=>s+(+l.valor||0),0),d:L.filter(l=>l.tipo==="despesa"&&((l.pagoEm||l.vencimento||"").slice(0,7)===mm)).reduce((s,l)=>s+(+l.valor||0),0)}));
  const repasses={};L.filter(l=>l.tipo==="receita"&&l.pagoEm&&l.pagoEm.slice(0,7)===m&&l.parceria).forEach(l=>repasses[l.parceria]=(repasses[l.parceria]||0)+(+l.valor||0));
  posRender.financeiro=()=>{
    $("fm").onchange=e=>{f.mes=e.target.value||mesAtual();render()};$("ft").onchange=e=>{f.tipo=e.target.value;render()};$("fs").onchange=e=>{f.st=e.target.value;render()};
    const s=$("fq");s.addEventListener("input",()=>{f.q=s.value;render();const n=$("fq");n.focus();n.setSelectionRange(n.value.length,n.value.length)});
    document.querySelectorAll("[data-lid]").forEach(el=>{const go=e=>{if(e.target.closest("[data-pagar]"))return;const l=L.find(x=>x.id===el.dataset.lid);l&&formLanc(l)};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter")go(e)})});
    document.querySelectorAll("[data-pagar]").forEach(b=>b.addEventListener("click",async e=>{e.stopPropagation();if(await salvar("lancamentos",b.dataset.pagar,{pagoEm:hojeISO()}))toast("Marcado como recebido hoje")}));
  };
  const nomeMes=MES[+m.slice(5)-1]+" de "+m.slice(0,4);
  return `<div class="view-h"><div><h1>Financeiro</h1><p>Honorários, recebimentos e despesas de ${nomeMes}</p></div>
  <div class="acts"><button class="btn" type="button" onclick="formLanc(null,{tipo:'despesa',categoria:'Custas e preparo'})">+ Despesa</button><button class="btn primary" type="button" onclick="formLanc()">+ Receita</button></div></div>
  ${aviso()}
  <section class="kpis">
    <div class="kpi" style="cursor:default"><small>Recebido no mês</small><b class="money" style="color:var(--ok)">${brl(rec)}</b><span>${L.filter(l=>l.tipo==="receita"&&(l.pagoEm||"").slice(0,7)===m).length} recebimentos</span></div>
    <div class="kpi" style="cursor:default"><small>Despesas do mês</small><b class="money" style="color:var(--bad)">${brl(desp)}</b><span>Resultado ${brl(rec-desp)}</span></div>
    <button class="kpi" type="button" onclick="F.fin.st='aberto';render()"><small>A receber</small><b class="money">${brl(aRec)}</b><span>${aberto.length} em aberto</span></button>
    <button class="kpi" type="button" onclick="F.fin.st='atraso';render()"><small>Em atraso</small><b class="money" style="${vVenc?"color:var(--bad)":""}">${brl(vVenc)}</b><span class="${vencidos.length?"bad":""}">${vencidos.length?vencidos.length+" cobranças vencidas":"Nada em atraso"}</span></button>
  </section>
  <div class="grid2" style="margin-bottom:16px">
    <section class="panel"><div class="ph"><h2>Últimos 6 meses</h2><span>recebido x despesas</span></div>${grafico(serie)}</section>
    <section class="panel"><div class="ph"><h2>Recebido por parceria</h2><span>${nomeMes}</span></div>
      <div class="rows">${Object.keys(repasses).length?Object.entries(repasses).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="r" style="grid-template-columns:1fr auto;cursor:default"><span class="t1">${esc(p)}</span><span class="val">${brl(v)}</span></div>`).join(""):`<div class="empty" style="border-top:1px solid var(--line)">Informe a parceria nos recebimentos para ver a divisão aqui e calcular os repasses.</div>`}</div></section>
  </div>
  <div class="tools"><input type="month" id="fm" value="${m}" aria-label="Mês" style="width:auto;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px">
    <select id="fs" aria-label="Visão"><option value="" ${!f.st?"selected":""}>Lançamentos do mês</option><option value="aberto" ${f.st==="aberto"?"selected":""}>Tudo a receber</option><option value="atraso" ${f.st==="atraso"?"selected":""}>Em atraso</option></select>
    <select id="ft" aria-label="Tipo"><option value="">Receitas e despesas</option><option value="receita" ${f.tipo==="receita"?"selected":""}>Só receitas</option><option value="despesa" ${f.tipo==="despesa"?"selected":""}>Só despesas</option></select>
    <input type="search" id="fq" value="${esc(f.q)}" placeholder="Buscar cliente ou descrição" aria-label="Buscar lançamentos"></div>
  <section class="panel fin"><div class="thead"><span>Data</span><span>Descrição</span><span>Categoria</span><span style="text-align:right">Valor</span><span>Situação</span></div>
  <div class="rows">${lista.length?lista.map(l=>{const pago=!!l.pagoEm;const venc=!pago&&l.vencimento&&dias(l.vencimento)<0;
    return `<div class="r" role="button" tabindex="0" data-lid="${esc(l.id)}">
      <div class="prazo"><span class="ml">Data</span>${fmtD(l.pagoEm||l.vencimento)}</div>
      <div class="c-desc" style="min-width:0"><div class="t1">${esc(l.descricao||l.categoria)}</div><div class="t2">${esc([l.cliente,l.parceria&&"Parceria: "+l.parceria].filter(Boolean).join(" · "))}</div></div>
      <div class="t2"><span class="ml">Categoria</span>${esc(l.categoria||"")}</div>
      <div class="val ${l.tipo==="receita"?"in":"out"}">${l.tipo==="despesa"?"− ":""}${brl(l.valor)}</div>
      <div>${pago?`<span class="pill ok">${l.tipo==="receita"?"Recebido":"Pago"}</span>`:venc?`<span class="pill bad">Vencido</span>`:`<span class="pill">Em aberto</span>`}${!pago&&l.tipo==="receita"?`<div style="margin-top:5px"><button class="btn sm" type="button" data-pagar="${esc(l.id)}">Recebi</button></div>`:""}</div></div>`}).join("")
  :`<div class="empty"><b>Nenhum lançamento nesta visão</b>Registre honorários com “+ Receita”. Parcelamentos geram uma linha por mês.</div>`}</div></section>`;
}
function grafico(serie){
  const W=520,H=200,pl=8,pb=26,pt=14;const mx=Math.max(1,...serie.map(s=>Math.max(s.r,s.d)));
  const step=(W-pl*2)/serie.length,bw=Math.min(26,step/3);
  const y=v=>H-pb-(v/mx)*(H-pb-pt);
  const lines=[0.5,1].map(f=>`<line x1="${pl}" x2="${W-pl}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-pl}" y="${y(mx*f)-4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${brl(mx*f).replace(",00","")}</text>`).join("");
  const bars=serie.map((s,i)=>{const cx=pl+step*i+step/2;return `<rect x="${cx-bw-1.5}" y="${y(s.r)}" width="${bw}" height="${Math.max(0,H-pb-y(s.r))}" rx="2" fill="var(--ok)"><title>Recebido ${brl(s.r)}</title></rect><rect x="${cx+1.5}" y="${y(s.d)}" width="${bw}" height="${Math.max(0,H-pb-y(s.d))}" rx="2" fill="var(--bad)" opacity=".75"><title>Despesas ${brl(s.d)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${MESC[+s.mm.slice(5)-1]}</text>`}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido e despesas por mês"><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${lines}${bars}</svg><div class="lg"><span><i style="background:var(--ok)"></i>Recebido</span><span><i style="background:var(--bad);opacity:.75"></i>Despesas</span></div></div>`;
}

const MODELOS=[
 {id:"proc-adjudicia",g:"Procurações e declarações",n:"Procuração ad judicia et extra",f:"procuracao",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","finalidade","cidade_assinatura","data_assinatura"],
  txt:`#T PROCURAÇÃO AD JUDICIA ET EXTRA\n\n#S OUTORGANTE:\n${QUALIF}.\n\n#S OUTORGADOS:\n{{advogados}}, integrantes de {{esc_nome}}, com endereço profissional em {{esc_endereco}}, e-mail {{esc_email}}.\n\n#S PODERES:\nPelo presente instrumento particular de mandato, o(a) OUTORGANTE nomeia e constitui seus bastantes procuradores os OUTORGADOS, aos quais confere os poderes da cláusula ad judicia et extra, para o foro em geral, em qualquer juízo, instância ou tribunal, podendo propor contra quem de direito as ações competentes e defendê-lo(a) nas contrárias, seguindo umas e outras até decisão final, usando de todos os recursos legais e acompanhando-os, conferindo-lhes, ainda, os poderes especiais previstos no art. 105 do Código de Processo Civil para receber citação, confessar, reconhecer a procedência do pedido, transigir, desistir, renunciar ao direito sobre o qual se funda a ação, receber, dar quitação, firmar compromisso e assinar declaração de hipossuficiência econômica, bem como para levantar alvarás, requerer certidões, representá-lo(a) perante órgãos públicos, PROCON, Banco Central do Brasil, plataforma consumidor.gov.br, concessionárias de serviço público e quaisquer pessoas jurídicas de direito público ou privado, podendo substabelecer esta a outrem, com ou sem reserva de iguais poderes, dando tudo por bom, firme e valioso, especialmente para {{finalidade}}.\n\n{{cidade_assinatura}}, {{data_assinatura}}.\n\n\n_______________________________________\n{{cliente_nome}}\nCPF {{cliente_cpf}}`},
 {id:"decl-hipo",g:"Procurações e declarações",n:"Declaração de hipossuficiência",f:"declaracao-hipossuficiencia",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","cidade_assinatura","data_assinatura"],
  txt:`#T DECLARAÇÃO DE HIPOSSUFICIÊNCIA ECONÔMICA\n\n${QUALIF}, DECLARA, para os fins do art. 98 e seguintes do Código de Processo Civil e sob as penas da lei, que não possui condições de arcar com as custas processuais e os honorários advocatícios sem prejuízo do sustento próprio e de sua família, razão pela qual faz jus à gratuidade da justiça.\n\nDeclara, ainda, estar ciente de que a falsidade desta declaração sujeita o declarante às sanções civis, administrativas e penais cabíveis.\n\n{{cidade_assinatura}}, {{data_assinatura}}.\n\n\n_______________________________________\n{{cliente_nome}}\nCPF {{cliente_cpf}}`},
 {id:"substab",g:"Procurações e declarações",n:"Substabelecimento com reserva",f:"substabelecimento",campos:["cliente_nome","reu_nome","processo","substabelecido","cidade_assinatura","data_assinatura"],
  txt:`#T SUBSTABELECIMENTO COM RESERVA DE PODERES\n\nPelo presente instrumento, {{advogados}}, SUBSTABELECEM, COM RESERVA DE IGUAIS PODERES, a {{substabelecido}}, os poderes que lhes foram conferidos por {{cliente_nome}}, nos autos do processo nº {{processo}}, movido em face de {{reu_nome}}, para que, em conjunto ou separadamente, pratique todos os atos necessários ao bom andamento do feito.\n\n{{cidade_assinatura}}, {{data_assinatura}}.\n\n\n{{assinaturas}}`},
 {id:"contrato",g:"Contratos e recibos",n:"Contrato de honorários (fixo + êxito)",f:"contrato-honorarios",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","reu_nome","finalidade","honor_fixo","honor_forma","honor_exito","foro","cidade_assinatura","data_assinatura"],
  txt:`#T CONTRATO DE PRESTAÇÃO DE SERVIÇOS ADVOCATÍCIOS E HONORÁRIOS\n\n#S CONTRATANTE:\n${QUALIF}.\n\n#S CONTRATADOS:\n{{advogados}}, integrantes de {{esc_nome}}, com endereço profissional em {{esc_endereco}}, e-mail {{esc_email}}.\n\nAs partes acima identificadas celebram o presente contrato, que se regerá pelas cláusulas seguintes e pela Lei nº 8.906/1994 (Estatuto da Advocacia e da OAB).\n\n#S CLÁUSULA 1ª – DO OBJETO\nOs CONTRATADOS prestarão ao CONTRATANTE serviços de assessoria e patrocínio jurídico para {{finalidade}}, em face de {{reu_nome}}, abrangendo a atuação extrajudicial, a propositura e o acompanhamento da ação em primeiro grau, a interposição ou resposta a recursos perante a Turma Recursal ou o Tribunal competente e o cumprimento de sentença.\n\nParágrafo único. Demandas diversas da descrita nesta cláusula, inclusive ações autônomas, recursos aos Tribunais Superiores e defesas em processos conexos, serão objeto de contratação à parte.\n\n#S CLÁUSULA 2ª – DOS HONORÁRIOS\nPelos serviços contratados, o CONTRATANTE pagará aos CONTRATADOS:\na) honorários iniciais fixos de R$ {{honor_fixo}}, pagos {{honor_forma}}, mediante PIX para a chave {{esc_pix}};\nb) honorários de êxito correspondentes a {{honor_exito}}% (por cento) do proveito econômico total obtido pelo CONTRATANTE, seja por sentença, acordo judicial ou extrajudicial, incidentes sobre o valor bruto efetivamente recebido, devidos no ato do recebimento.\n\nParágrafo primeiro. Os honorários de sucumbência pertencem exclusivamente aos CONTRATADOS, nos termos dos arts. 22 e 23 da Lei nº 8.906/1994, e não se compensam com os honorários ora pactuados.\n\nParágrafo segundo. Havendo levantamento de valores por alvará ou transferência à conta dos CONTRATADOS, fica desde já autorizada a retenção dos honorários de êxito, com repasse do saldo ao CONTRATANTE em até 5 (cinco) dias úteis, acompanhado de prestação de contas.\n\n#S CLÁUSULA 3ª – DAS DESPESAS\nCustas, preparo recursal, perícias, certidões, diligências, cópias e deslocamentos necessários à causa são de responsabilidade do CONTRATANTE e não estão incluídos nos honorários, devendo ser reembolsados mediante comprovação.\n\n#S CLÁUSULA 4ª – DAS OBRIGAÇÕES DO CONTRATANTE\nO CONTRATANTE obriga-se a: (i) fornecer, com veracidade e no prazo solicitado, todos os documentos e informações necessários; (ii) comparecer pessoalmente às audiências, ciente de que, no Juizado Especial, a ausência do autor acarreta a extinção do processo e pode gerar condenação em custas (art. 51, I e §2º, da Lei nº 9.099/1995); (iii) manter seus dados de contato atualizados; (iv) não celebrar acordo diretamente com a parte contrária sem a ciência dos CONTRATADOS.\n\n#S CLÁUSULA 5ª – DO ACORDO SEM PARTICIPAÇÃO DOS CONTRATADOS\nCaso o CONTRATANTE realize acordo diretamente com a parte contrária, sem a intervenção dos CONTRATADOS, os honorários de êxito serão devidos integralmente sobre o valor acordado.\n\n#S CLÁUSULA 6ª – DA NATUREZA DA OBRIGAÇÃO\nA obrigação assumida pelos CONTRATADOS é de meio, e não de resultado, comprometendo-se a empregar todo o zelo e a técnica profissional na defesa dos interesses do CONTRATANTE.\n\n#S CLÁUSULA 7ª – DA REVOGAÇÃO E DA RENÚNCIA\nA revogação do mandato pelo CONTRATANTE não o desobriga do pagamento dos honorários fixos integrais e dos honorários de êxito proporcionais ao trabalho realizado, caso o resultado venha a ser obtido. A renúncia pelos CONTRATADOS observará o dever de comunicação e o prazo legal de representação.\n\n#S CLÁUSULA 8ª – DO INADIMPLEMENTO\nO atraso no pagamento de qualquer parcela acarretará multa de 2% (dois por cento), juros de mora de 1% (um por cento) ao mês e correção monetária pelo IPCA, sem prejuízo da cobrança judicial.\n\n#S CLÁUSULA 9ª – DO TÍTULO EXECUTIVO\nEste contrato constitui título executivo extrajudicial, nos termos do art. 24 da Lei nº 8.906/1994 e do art. 784, XII, do Código de Processo Civil.\n\n#S CLÁUSULA 10ª – DA PROTEÇÃO DE DADOS\nOs dados pessoais do CONTRATANTE serão tratados exclusivamente para a execução deste contrato e para o exercício regular de direitos em processo judicial ou administrativo (art. 7º, V e VI, da Lei nº 13.709/2018), mantido o sigilo profissional.\n\n#S CLÁUSULA 11ª – DAS COMUNICAÇÕES\nAs partes reconhecem como válidas as comunicações realizadas por e-mail e WhatsApp, nos contatos informados neste instrumento.\n\n#S CLÁUSULA 12ª – DO FORO\nFica eleito o foro da Comarca de {{foro}} para dirimir quaisquer controvérsias oriundas deste contrato.\n\nE, por estarem justas e contratadas, as partes assinam o presente instrumento em 2 (duas) vias de igual teor, na presença de duas testemunhas.\n\n{{cidade_assinatura}}, {{data_assinatura}}.\n\n\n_______________________________________\n{{cliente_nome}} – CONTRATANTE\n\n\n{{assinaturas}}\n\n\nTESTEMUNHAS:\n\n1. _______________________________ CPF: ________________\n\n2. _______________________________ CPF: ________________`},
 {id:"recibo",g:"Contratos e recibos",n:"Recibo de honorários",f:"recibo-honorarios",campos:["cliente_nome","cliente_cpf","valor_recibo","ref_recibo","cidade_assinatura","data_assinatura"],
  txt:`#T RECIBO DE HONORÁRIOS ADVOCATÍCIOS\n\nRecebemos de {{cliente_nome}}, inscrito(a) no CPF sob o nº {{cliente_cpf}}, a importância de R$ {{valor_recibo}}, referente a {{ref_recibo}}, pelo que damos plena e geral quitação quanto ao valor ora recebido.\n\n{{cidade_assinatura}}, {{data_assinatura}}.\n\n\n{{assinaturas}}`},
 {id:"ini-voo",g:"Petições iniciais",n:"Atraso ou cancelamento de voo",f:"inicial-voo",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","reu_nome","reu_cnpj","reu_endereco","comarca","valor_moral","valor_material","valor_causa","cidade_assinatura","data_assinatura"],
  txt:CAB_JEC+ABERT("AÇÃO DE INDENIZAÇÃO POR DANOS MATERIAIS E MORAIS")+PRELIM+`#S III. DOS FATOS\n\nA parte autora adquiriu passagem aérea da Ré, reserva nº [LOCALIZADOR], para o voo [Nº DO VOO], trecho [ORIGEM → DESTINO], com partida prevista para [DATA], às [HORA], e chegada às [HORA].\n\n[Narrar em ordem cronológica: quando e como soube do atraso/cancelamento; se houve aviso com 72h de antecedência; o tempo efetivo de atraso na chegada ao destino final; a assistência material oferecida ou negada (comunicação, alimentação, hospedagem, transporte); a reacomodação; os gastos extras; e a consequência concreta para a parte autora — compromisso, trabalho, evento, prova, conexão perdida.]\n\n#S IV. QUADRO-RESUMO\n\nVoo contratado: [nº, data e horário] | Voo efetivo: [nº, data e horário] | Atraso na chegada: [__ horas] | Assistência material: [não prestada / parcial] | Prejuízo concreto: [descrever] | Gastos comprovados: R$ {{valor_material}}\n\n#S V. DO DIREITO\n\n1. Da relação de consumo e da responsabilidade objetiva. A Ré é fornecedora de serviço de transporte aéreo e responde, independentemente de culpa, pelos danos causados por falha na prestação do serviço (arts. 2º, 3º e 14 do CDC). Problemas técnicos, operacionais e de malha aérea constituem fortuito interno, inerente ao risco da atividade, e não afastam o dever de indenizar.\n\n2. Das obrigações regulatórias descumpridas. A Resolução ANAC nº 400/2016 impõe à transportadora informar alterações programadas com antecedência mínima de 72 horas (art. 12), oferecer reacomodação, reembolso ou execução por outra modalidade em atrasos superiores a 4 horas e cancelamentos (art. 21) e prestar assistência material gradativa — comunicação a partir de 1 hora, alimentação a partir de 2 horas e hospedagem a partir de 4 horas (arts. 26 e 27). [Indicar quais obrigações foram descumpridas.]\n\n3. Da demonstração do dano extrapatrimonial. Nos termos do art. 251-A do Código Brasileiro de Aeronáutica, o dano extrapatrimonial decorrente de falha no transporte aéreo deve ser demonstrado. No caso, o prejuízo é concreto e documentado: [descrever o efeito do atraso na vida da parte autora e os documentos que o comprovam].\n\n4. Dos danos materiais. Os gastos extraordinários suportados pela parte autora, no total de R$ {{valor_material}}, estão comprovados pelos documentos anexos e devem ser ressarcidos integralmente (art. 6º, VI, do CDC).\n\n`+DANO_MORAL+`#S DOS PEDIDOS\n\nDiante do exposto, requer:\na) a citação da Ré para comparecer à audiência de conciliação e, querendo, apresentar defesa, sob pena de revelia;\nb) a inversão do ônus da prova (art. 6º, VIII, do CDC);\nc) a condenação da Ré ao pagamento de R$ {{valor_material}} a título de danos materiais, com correção monetária desde o desembolso e juros de mora desde a citação;\nd) a condenação da Ré ao pagamento de R$ {{valor_moral}} a título de danos morais, com correção monetária desde o arbitramento e juros de mora desde a citação;\ne) a concessão da gratuidade da justiça para fins recursais.\n\n`+FECHO},
 {id:"ini-neg",g:"Petições iniciais",n:"Negativação ou cobrança indevida",f:"inicial-negativacao",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","reu_nome","reu_cnpj","reu_endereco","comarca","valor_moral","valor_material","valor_causa","cidade_assinatura","data_assinatura"],
  txt:CAB_JEC+ABERT("AÇÃO DECLARATÓRIA DE INEXISTÊNCIA DE DÉBITO C/C INDENIZAÇÃO POR DANOS MORAIS E PEDIDO DE TUTELA DE URGÊNCIA")+PRELIM+`#S III. DOS FATOS\n\nA parte autora foi surpreendida, em [DATA], ao [tentar crédito / consultar o CPF], com a inscrição de seu nome nos cadastros de proteção ao crédito ([SERASA/SPC/BOA VISTA]), por iniciativa da Ré, referente ao suposto débito de R$ [VALOR], contrato nº [Nº], com data de inclusão em [DATA].\n\n[Narrar: por que o débito é indevido — nunca contratou / dívida já paga em DATA / valor cobrado diverge do contratado; se recebeu notificação prévia; as tentativas de solução (protocolos, consumidor.gov, Procon) e as respostas da Ré.]\n\nRessalte-se que a parte autora não possui outras inscrições legítimas preexistentes, conforme consulta anexa, o que afasta a incidência da Súmula 385 do STJ.\n\n#S IV. QUADRO-RESUMO\n\nCredor: {{reu_nome}} | Valor negativado: R$ [__] | Data da inclusão: [__] | Motivo de ser indevido: [__] | Outras negativações: nenhuma | Protocolos: [__]\n\n#S V. DO DIREITO\n\n1. Da inexistência do débito e do ônus da prova. Cabe à Ré, nos termos do art. 6º, VIII, do CDC e do art. 373, II, do CPC, demonstrar a origem e a regularidade da dívida, apresentando o contrato assinado e a prova da contratação — prova que a parte autora, por se tratar de fato negativo, não tem como produzir.\n\n2. Da responsabilidade objetiva. A Ré responde independentemente de culpa pelos danos causados por falha na prestação do serviço (art. 14 do CDC), inclusive por fraudes praticadas por terceiros, que integram o risco da atividade.\n\n3. Do dano moral presumido. A inscrição indevida em cadastro de inadimplentes gera dano moral in re ipsa, que dispensa prova do prejuízo, por atingir diretamente a honra e o crédito do consumidor.\n\n[Se houve pagamento do valor cobrado: 4. Da repetição do indébito. O valor indevidamente pago deve ser restituído em dobro, com correção monetária e juros legais (art. 42, parágrafo único, do CDC).]\n\n#S VI. DA TUTELA DE URGÊNCIA\n\nEstão presentes os requisitos do art. 300 do CPC: a probabilidade do direito decorre dos documentos anexos, que demonstram [o pagamento / a inexistência de contratação]; o perigo de dano é evidente, pois a restrição impede a parte autora de obter crédito e realizar operações básicas. Requer, assim, a imediata exclusão do seu nome dos cadastros restritivos, sob pena de multa diária.\n\n`+DANO_MORAL+`#S DOS PEDIDOS\n\nDiante do exposto, requer:\na) a concessão de tutela de urgência para determinar a exclusão do nome da parte autora dos cadastros de proteção ao crédito, em até 48 horas, sob pena de multa diária de R$ [__];\nb) a citação da Ré para comparecer à audiência de conciliação e, querendo, apresentar defesa;\nc) a inversão do ônus da prova (art. 6º, VIII, do CDC);\nd) a declaração de inexistência do débito de R$ [__], referente ao contrato nº [__];\ne) a condenação da Ré ao pagamento de R$ {{valor_moral}} a título de danos morais, com correção desde o arbitramento e juros desde o evento danoso;\nf) [se houver pagamento] a restituição em dobro de R$ {{valor_material}};\ng) a concessão da gratuidade da justiça para fins recursais.\n\n`+FECHO},
 {id:"ini-pix",g:"Petições iniciais",n:"Fraude bancária / PIX",f:"inicial-fraude-pix",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","reu_nome","reu_cnpj","reu_endereco","comarca","valor_moral","valor_material","valor_causa","cidade_assinatura","data_assinatura"],
  txt:CAB_JEC+ABERT("AÇÃO DE RESTITUIÇÃO DE VALORES C/C INDENIZAÇÃO POR DANOS MORAIS")+PRELIM+`#S III. DOS FATOS\n\nA parte autora é correntista da Ré, agência [__], conta [__]. Em [DATA], às [HORA], foi realizada a transferência via PIX no valor de R$ {{valor_material}} para [NOME DO DESTINATÁRIO], [CPF/CNPJ], instituição [__], conforme comprovante e extrato anexos.\n\n[Narrar com precisão de horários: como ocorreu a fraude (falso gerente, falsa central, invasão, transação não reconhecida); se o fraudador possuía dados que apenas o banco detinha; quando a parte autora comunicou o banco, por qual canal e com qual protocolo; se houve pedido de MED; o boletim de ocorrência; a resposta do banco.]\n\nA operação destoou completamente do perfil de movimentação da parte autora [valor, horário, destinatário novo, sucessão de transações], e mesmo assim foi processada pelo sistema da Ré sem qualquer bloqueio ou confirmação adicional.\n\n#S IV. QUADRO-RESUMO\n\nData/hora da transação: [__] | Valor: R$ {{valor_material}} | Destinatário: [__] | Comunicação ao banco: [data/hora, protocolo] | MED: [sim/não] | Boletim de ocorrência: [nº] | Resposta do banco: [__]\n\n#S V. DO DIREITO\n\n1. Da responsabilidade objetiva da instituição financeira. As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias (Súmula 479 do STJ e art. 14 do CDC).\n\n2. Do dever de segurança e de monitoramento. Compete à instituição manter sistemas capazes de identificar transações atípicas e incompatíveis com o perfil do cliente, bem como proteger os dados pessoais sob sua guarda (art. 46 da Lei nº 13.709/2018). [Se o golpista conhecia dados bancários do cliente: o conhecimento, pelo fraudador, de dados que somente a Ré detinha evidencia falha na guarda de informações.]\n\n3. Do Mecanismo Especial de Devolução. O Regulamento do Pix (Resolução BCB nº 1/2020) prevê o MED justamente para recuperar valores em casos de fraude. [Descrever se a Ré deixou de acioná-lo, acionou tardiamente ou não informou o resultado.]\n\n4. Do dano material. O prejuízo de R$ {{valor_material}} está documentado pelo extrato e pelo comprovante anexos e deve ser integralmente restituído, com correção desde o desembolso.\n\n`+DANO_MORAL+`#S DOS PEDIDOS\n\nDiante do exposto, requer:\na) a citação da Ré para comparecer à audiência de conciliação e, querendo, apresentar defesa;\nb) a inversão do ônus da prova (art. 6º, VIII, do CDC), determinando-se à Ré a apresentação dos registros de acesso, dispositivo, IP e geolocalização da operação impugnada;\nc) a condenação da Ré à restituição de R$ {{valor_material}}, com correção monetária desde a transação e juros desde a citação;\nd) a condenação da Ré ao pagamento de R$ {{valor_moral}} a título de danos morais;\ne) a concessão da gratuidade da justiça para fins recursais.\n\n`+FECHO},
 {id:"ini-vicio",g:"Petições iniciais",n:"Vício do produto / compra online",f:"inicial-vicio-produto",campos:["cliente_nome","cliente_nacionalidade","cliente_estado_civil","cliente_profissao","cliente_rg","cliente_cpf","cliente_endereco","cliente_email","cliente_telefone","reu_nome","reu_cnpj","reu_endereco","comarca","valor_moral","valor_material","valor_causa","cidade_assinatura","data_assinatura"],
  txt:CAB_JEC+ABERT("AÇÃO DE RESTITUIÇÃO DE VALORES C/C INDENIZAÇÃO POR DANOS MORAIS")+PRELIM+`#S III. DOS FATOS\n\nEm [DATA], a parte autora adquiriu da Ré o produto [DESCRIÇÃO, MODELO], pelo valor de R$ {{valor_material}}, conforme Nota Fiscal nº [__] e comprovante de pagamento anexos.\n\n[Narrar: data da entrega; data e forma em que o defeito se manifestou; reclamações e protocolos (datas, canais, atendentes); visitas técnicas e ordens de serviço; prazo de 30 dias transcorrido sem solução; recusa de troca ou reembolso; impacto no dia a dia, especialmente se o produto é essencial.]\n\n#S IV. QUADRO-RESUMO\n\nProduto: [__] | Compra: [data, NF] | Valor: R$ {{valor_material}} | Defeito constatado em: [__] | Primeira reclamação: [data, protocolo] | Dias sem solução: [__] | Protocolos/OS: [__]\n\n#S V. DO DIREITO\n\n1. Da responsabilidade solidária pelo vício. Fabricante e comerciante respondem solidariamente pelos vícios de qualidade que tornem o produto impróprio ao uso (arts. 7º, parágrafo único, 18 e 25, §1º, do CDC).\n\n2. Do prazo de 30 dias e do direito de escolha. Não sanado o vício no prazo máximo de 30 dias, o consumidor pode exigir, à sua escolha, a substituição do produto, a restituição imediata da quantia paga, monetariamente atualizada, ou o abatimento proporcional do preço (art. 18, §1º, do CDC). A parte autora opta pela [restituição integral / substituição].\n\n3. Da tempestividade. A reclamação comprovadamente formulada ao fornecedor obsta a decadência até a resposta negativa inequívoca (art. 26, §2º, I, do CDC). [Indicar datas.]\n\n[Se compra fora do estabelecimento e pedido de arrependimento: 4. Do direito de arrependimento. Nas contratações fora do estabelecimento comercial, o consumidor pode desistir em 7 dias, com devolução imediata dos valores pagos (art. 49 do CDC).]\n\n`+DANO_MORAL+`#S DOS PEDIDOS\n\nDiante do exposto, requer:\na) a citação da Ré para comparecer à audiência de conciliação e, querendo, apresentar defesa;\nb) a inversão do ônus d function runs(text,bold){

async function baixarDocx(m,txt){
  if(typeof JSZip==="undefined"){toast("O gerador de Word não carregou. Use “Copiar texto”.");return}
  if(!dl){toast("Download indisponível nesta visualização. Use “Copiar texto”.");return}
  const ps=txt.split("\n").map(l=>{
    let al="both",b=false,t=l,color="";
    if(l.startsWith("#T ")){al="center";b=true;t=l.slice(3);color='<w:color w:val="1F3864"/>'}
    else if(l.startsWith("#S ")){b=true;t=l.slice(3)}
    else if(l.length<80&&!/[.;:]$/.test(l.trim()))al="left";
    const sp=t.trim()===""?'<w:spacing w:after="0" w:line="276" w:lineRule="auto"/>':'<w:spacing w:after="120" w:line="360" w:lineRule="auto"/>';
    const ind=(!l.startsWith("#")&&t.length>90)?'<w:ind w:firstLine="1418"/>':"";
    let r=runs(t,b);if(color)r=r.replace(/<w:b\/>/g,"<w:b/>"+color);
    return `<w:p><w:pPr><w:jc w:val="${al}"/>${sp}${ind}</w:pPr>${r}</w:p>`;
  }).join("");
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${ps}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1701" w:right="1134" w:bottom="1134" w:left="1701" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip=new JSZip();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml",doc);
  const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const caso=S.casos.find(x=>x.id===F.mod.casoId);const nm=(caso?caso.cliente:(F.mod.vals.cliente_nome||"")).split(" ")[0];
  const fn=(m.f+(nm?"-"+nm:"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9-]+/g,"-")+".docx";
  try{await dl.save({filename:fn,data:blob});toast("Documento salvo")}catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="extension_not_enabled"?"Download de Word indisponível aqui. Use “Copiar texto”.":"Não foi possível baixar. Use “Copiar texto”.")}
}

function avaliar(t){
  const R=F.tri.resp;let pts=0,max=0,min=0;const fortes=[],alertas=[],docs=[];let respondidas=0,total=0;
  t.qs.forEach((q,i)=>{
    if(q.tipo==="data"){total++;const v=R[i];if(v){respondidas++;const anos=(Date.now()-dt(v))/31557600000;const intl=t.id==="voo"&&R[2]===1;const lim=intl?(q.prazo.anosIntl||q.prazo.anos):q.prazo.anos;
      if(anos>lim)alertas.unshift(`PRESCRIÇÃO: fato ocorrido há mais de ${lim} anos — pretensão possivelmente prescrita.`);else if(anos>lim-0.5)alertas.unshift(`Prazo prescricional de ${lim} anos vence em menos de 6 meses: priorizar o ajuizamento.`)}return}
    total++;const ps=q.o.map(o=>o.p);max+=Math.max(...ps);min+=Math.min(...ps);
    const r=R[i];if(r===undefined)return;respondidas++;const o=q.o[r];pts+=o.p;if(o.forte)fortes.push(o.forte);if(o.alerta)alertas.push(o.alerta);if(o.doc)docs.push(o.doc);
  });
  const pct=max===min?0:Math.round((pts-min)/(max-min)*100);
  const prescrito=alertas.some(a=>a.startsWith("PRESCRIÇÃO"));
  const bloqueio=alertas.some(a=>/Súmula 385\/STJ|ação inviável|dano moral muito improvável/.test(a));
  let nivel=prescrito?"Inviável":pct>=68?"Alta":pct>=45?"Média":"Baixa";if(bloqueio&&nivel!=="Inviável")nivel="Baixa";
  return {pct,nivel,fortes,alertas,docs:[...new Set(docs.concat(t.docs))],respondidas,total};
}

    ()=>{$("syncDot").classList.remove("on");$("syncTxt").textContent="Conexão interrompida — recarregue"})});
})();
</script>
